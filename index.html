<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Hand. — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --oak:#D8C3A0; --oak-d:#C2A67C;
  --leather:#A9BBA5; --leather-d:#98AC94;
  --brass:#B8955A;
  --paper:#FBF6EA; --ink:#33302B; --ink2:#5F5A52; --line:#E2D9C6;
  --sage:#4F6B55; --sage-l:#E6EDE2;
  --fs:18px; --font:'Lexend', Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--oak);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.6;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 30%, var(--leather) 0%, var(--leather-d) 100%);
  border-left:10px solid var(--oak);border-right:10px solid var(--oak);
  box-shadow:inset 0 0 0 3px var(--leather-d), inset 0 0 0 4px var(--brass), inset 0 0 50px rgba(40,50,35,.18)}
header{display:flex;align-items:center;gap:10px;padding:18px 18px 6px}
.brand{flex:1;display:flex;flex-direction:column;line-height:1.2}
.brand b{font-weight:600;font-size:1.15em}
.brand span{font-size:.8em}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:22px;padding:0 14px;height:44px;font-weight:600;border:none}
.iconbtn{width:48px;height:48px;border-radius:24px;border:none;background:var(--paper);display:flex;align-items:center;justify-content:center;flex:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.big{width:44px;height:44px}
svg.i.huge{width:72px;height:72px;stroke-width:1.4}
main{flex:1;padding:8px 18px 120px;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5em;font-weight:600;margin:4px 0 0;line-height:1.3}
h2{font-size:1em;font-weight:600;margin:0}
.card{background:var(--paper);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:14px}
.muted{color:var(--ink2)}
.small{font-size:.85em}
.label{font-size:.8em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.now{border:3px solid var(--sage)}
.tile{width:56px;height:56px;border-radius:14px;background:var(--sage-l);color:var(--sage);display:flex;align-items:center;justify-content:center;flex:none}
.btn{min-height:56px;border:none;border-radius:16px;padding:0 22px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.primary{background:var(--sage);color:var(--paper)}
.btn.soft{background:var(--sage-l);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.btn.full{width:100%}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pick{background:var(--paper);border:none;border-radius:16px;min-height:96px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:.9em}
.pick .tile{width:48px;height:48px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--paper);padding:6px;border-radius:16px}
.seg button{min-height:48px;border:none;border-radius:12px;background:transparent;font-weight:500}
.seg button.on{background:var(--sage);color:var(--paper)}
.badge{align-self:flex-start;background:var(--brass);color:#2B2418;font-size:.75em;font-weight:600;padding:2px 10px;border-radius:10px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:space-around;background:var(--oak);padding:8px 10px 14px;border-top:3px solid var(--oak-d)}
nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75em;min-width:72px;min-height:56px;padding:4px;border-radius:12px;color:var(--ink)}
nav button.on{background:var(--paper);font-weight:600}
.ring{position:relative;width:230px;height:230px;align-self:center}
.ring svg{width:230px;height:230px;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-size:3em;font-weight:600;line-height:1}
.step{background:var(--paper);border-radius:20px;padding:20px;display:flex;align-items:center;gap:16px}
.step .tile{width:72px;height:72px;border-radius:18px}
.step p{margin:0;font-size:1.2em;font-weight:500;line-height:1.4}
.drawer{background:linear-gradient(#E9D9BC,#DCC59F);border:none;border-radius:12px;min-height:118px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);color:var(--ink);text-align:center}
.drawer .handle{width:46px;height:8px;border-radius:4px;background:var(--brass)}
.drawer.locked{opacity:.6}
.drawer small{font-size:.75em}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{background:var(--paper);border:2px solid var(--line);border-radius:14px;min-height:48px;padding:6px 14px;font-size:1em}
.word.on{border-color:var(--sage);background:var(--sage-l)}
.sentence{background:var(--paper);border-radius:16px;padding:16px;min-height:72px;font-size:1.15em;border:2px dashed var(--sage)}
.overlay{position:fixed;inset:0;background:rgba(40,40,30,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--paper);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 28px;display:flex;flex-direction:column;gap:16px}
.sheet .pick{background:var(--sage-l)}
.sheetHead{display:flex;align-items:center;gap:10px}
.sheetHead h2{flex:1;font-size:1.2em}
input[type=text],textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;min-height:52px}
textarea{min-height:90px;resize:vertical}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.opt button{min-height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;padding:0 16px}
.opt button.on{border-color:var(--sage);background:var(--sage-l);font-weight:600}
.swatch{width:52px;height:52px;border-radius:26px;border:2px solid var(--line)}
.swatch.on{border:4px solid var(--sage)}
.mm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mm textarea{min-height:84px;font-size:.85em;padding:8px}
.mm .c{border-color:var(--sage);background:var(--sage-l);font-weight:600}
.cn{display:grid;grid-template-columns:2fr 3fr;gap:8px}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:14px;z-index:20;max-width:90%;text-align:center}
.done{text-decoration:line-through;color:var(--ink2)}
.idea{background:var(--paper);border:none;border-radius:16px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:.85em;padding:8px}
.idea.on{outline:3px solid var(--sage)}
.sign{background:var(--paper);border:3px solid var(--brass);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:opacity .5s, transform .5s}
.sign.out{opacity:0;transform:translateY(-8px)}
.sign p{margin:0}
.help{position:absolute;top:6px;right:18px;width:48px;height:48px;border-radius:24px;border:2px solid var(--brass);background:var(--paper);font-weight:600;font-size:1.2em}
main{position:relative}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.btn[disabled]{opacity:.5}
a{color:var(--sage)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>A Hand.</b><span id="date"></span></div>
    <button class="chip" data-act="go" data-v="drawers" aria-label="Medals"><span id="medalIcon"></span><span id="medals">0</span></button>
    <button class="iconbtn" data-act="say" aria-label="Read this screen out loud"><span id="spk"></span></button>
    <button class="iconbtn" data-act="settings" aria-label="Settings"><span id="gear"></span></button>
  </header>
  <main id="view"></main>
</div>
<nav id="nav"></nav>
<div id="layer"></div>

let AC=null;
function chime(){
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  [[523.25,0],[659.25,.35],[783.99,.7]].forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
   g.gain.setValueAtTime(0,AC.currentTime+t);g.gain.linearRampToValueAtTime(.12,AC.currentTime+t+.05);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+1.2);
   o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+1.3)});
 }catch(e){}
 try{navigator.vibrate&&navigator.vibrate([150,80,150])}catch(e){}
}
function speak(text){
 try{if(!('speechSynthesis' in window))return toast('Read-aloud is not available here');
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
  const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/en-IE/i.test(v.lang))||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
  u.lang=u.voice?u.voice.lang:'en-GB';u.rate=S.set.rate;speechSynthesis.speak(u)}catch(e){}
}

let TICK=null;
function startSession(ids){
 if(!ids.length){toast('Nothing to start');return}
 chime();
 V.sess={queue:ids,idx:0,phase:'go',step:0,t0:Date.now(),dur:S.beat[S.hw.find(h=>h.id===ids[0]).type],msg:''};

function sessTask(){const s=V.sess;return S.hw.find(h=>h.id===s.queue[s.idx])}
function vStart(){
 const s=V.sess;
 if(!s){
  const p=plan();
  SAY=p.length?`Ready? I suggest ${p[0].subj} first.`:'Nothing to start. Add homework first.';
  return `<h1>Start</h1>`+(p.length?`<div class="card"><span class="label">I suggest you start with</span><div class="row"><div class="tile">${ic(SUBJ[p[0].subj]||'book','big')}</div><div><div class="small muted">${esc(p[0].subj)} · ${TYPES[p[0].type].name}</div><h2>${esc(p[0].detail||TYPES[p[0].type].name)}</h2></div></div><button class="btn primary" data-act="startOne" data-v="${p[0].id}">${ic('play')} Go</button></div><button class="btn soft full" data-act="startTonight">${ic('list')} Do all of tonight's</button>`:`<div class="card"><p style="margin:0">Nothing to start. Add homework first.</p><button class="btn soft" data-act="go" data-v="homework">${ic('book')} Homework</button></div>`);
 }
 const t=sessTask(),T=TYPES[t.type];
 const head=`<div class="row"><div class="tile">${ic(SUBJ[t.subj]||'book','big')}</div><div style="flex:1"><div class="small muted">${esc(t.subj)} · ${T.name}${s.queue.length>1?` · task ${s.idx+1} of ${s.queue.length}`:''}</div><h2>${esc(t.detail||T.name)}</h2></div></div>`;
 if(s.phase==='go'||s.phase==='work'){
  const st=T.steps[s.step];
  SAY=(s.phase==='go'?'Step one. ':'')+st[1];
  return head+`<div class="step"><div class="tile">${ic(st[0],'big')}</div><div style="flex:1"><div class="label">Step ${s.step+1} of ${T.steps.length}</div><p>${esc(st[1])}</p></div><button class="iconbtn" style="background:var(--sage-l)" data-act="sayStep" aria-label="Read step out loud">${ic('speaker')}</button></div>
   ${ringHTML(s.phase==='go'?'time to beat':'for this step')}
   <div class="small muted" id="over" style="text-align:center;min-height:1.6em">${s.msg?esc(s.msg):''}</div>
   <button class="btn primary full" id="doneBtn" data-act="stepDone">${ic('check')} <span id="doneTxt">${s.phase==='go'?"I've done it":'Done, next'}</span></button>
   <button class="btn ghost" data-act="endSess">Not now</button>`;
 }
 if(s.phase==='proof'){
  SAY='Nice. Now show your work. Take a photo of your finished work to earn the medal.';
  return head+`<div class="card" style="align-items:center;text-align:center"><div class="tile" style="width:88px;height:88px">${ic('camera','huge')}</div><h1>Show your work</h1><p style="margin:0">Take a photo of your finished work to earn the medal.</p><p class="small muted" style="margin:0">The photo stays on your phone.</p></div>
   <label class="btn primary full">${ic('camera')} Take photo<input type="file" accept="image/*" capture="environment" id="proofIn" hidden></label>
   <button class="btn soft full" data-act="notYet">${ic('back')} Not finished yet</button>
   <button class="btn ghost" data-act="noProof">Finish without a photo (no medal this time)</button>`;
 }
 if(s.phase==='done'){
  const na=nextAward(),la=lastAward(),justAward=la&&la[0]===S.medals;
  const newDrawer=DRAWERS.find(d=>d[3]===S.medals);
  if(!s.medal){SAY='Task done.';return head+`<div class="card" style="align-items:center;text-align:center">${ic('check','huge')}<h1>Task done.</h1><p style="margin:0">Next time, a photo earns the medal.</p></div>`+(s.idx<s.queue.length-1?`<button class="btn primary full" data-act="toBreak">${ic('cup')} Take a 5 min break</button>`:`<button class="btn primary full" data-act="endSess">${ic('check')} Finish</button>`)}
  SAY=`Task done. Medal earned. You have ${S.medals}.`;
  return head+`<div class="card" style="align-items:center;text-align:center"><div style="color:var(--brass)">${ic('medal','huge')}</div><h1>Task done.</h1><p style="margin:0">Medal earned. You have <b>${S.medals}</b>.</p>${t.proof?`<img class="thumb" style="width:120px;height:120px" src="${t.proof}" alt="Photo of your work">`:'<p class="small muted" style="margin:0">In class: your teacher sees it.</p>'}
   ${justAward?`<p style="margin:0"><b>Big award: ${la[1]}!</b></p>`:''}
   ${newDrawer&&!S.set.showAll?`<p style="margin:0">New drawer open: <b>${newDrawer[1]}</b></p>`:''}
   ${na?`<div style="width:100%"><div class="bar"><i style="width:${Math.round(S.medals/na[0]*100)}%"></i></div><div class="small muted">${na[0]-S.medals} more to ${na[1]}</div></div>`:''}</div>
   ${s.idx<s.queue.length-1?`<button class="btn primary full" data-act="toBreak">${ic('cup')} Take a 5 min break</button>`:`<button class="btn primary full" data-act="endSess">${ic('check')} Finish</button>`}`;
 }
 if(s.phase==='break'){
  SAY='Break time. Five minutes. Put the phone face down. I will chime when it is time.';
  return `<h1>Break · 5 min</h1>${ringHTML('break left')}
   <div class="card"><div class="row">${ic('phone','big')}<p style="margin:0">Phone face down. I'll chime when it's time.</p></div></div>
   <span class="label">Ideas</span><div class="grid3">${IDEAS.map((x,i)=>`<button class="idea ${V.ideas.includes(i)?'on':''}" data-act="idea" data-v="${i}">${ic(x[0],'big')}<span>${x[1]}</span></button>`).join('')}</div>
   <button class="btn primary full" data-act="breakDone">${ic('play')} Back to it</button>`;
 }
 if(s.phase==='finished'){SAY='All sorted for tonight. Well done.';return `<div class="card" style="align-items:center;text-align:center">${ic('check','huge')}<h1>All sorted.</h1><p style="margin:0">You have ${S.medals} medals.</p><button class="btn primary" data-act="go" data-v="today">Done</button></div>`}
 return '';
}
function ringHTML(lab){
 return `<div class="ring"><svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="100" fill="none" stroke="var(--paper)" stroke-width="18"/><circle id="arc" cx="115" cy="115" r="100" fill="none" stroke="var(--sage)" stroke-width="18" stroke-linecap="round" stroke-dasharray="628.3" stroke-dashoffset="0"/></svg><div class="t"><b id="tleft">${mmss(V.sess.dur)}</b><span class="small">${lab}</span></div></div>`;
}
function tick(){
 const s=V.sess;if(!s||!['go','work','break'].includes(s.phase))return;
 const el=(Date.now()-s.t0)/1000,left=s.dur-el;
 const arc=document.getElementById('arc'),tl=document.getElementById('tleft'),ov=document.getElementById('over');
 if(arc)arc.setAttribute('stroke-dashoffset',String(628.3*Math.min(1,el/s.dur)));
 if(tl)tl.textContent=left>=0?mmss(left):'+'+mmss(-left);
 if(left<0&&ov&&s.phase!=='break')ov.textContent='Take your time. Keep going.';
 const db=document.getElementById('doneBtn'),dt=document.getElementById('doneTxt');
 if(db&&s.phase==='work'){const wait=el<15;db.disabled=wait;if(dt)dt.textContent=wait?'Keep at it…':'Done, next'}
 if(s.phase==='break'&&left<=0&&!s.chimed){s.chimed=true;chime();if(tl)tl.textContent='0:00'}
}
function stepDone(){
 const s=V.sess,t=sessTask(),T=TYPES[t.type],el=(Date.now()-s.t0)/1000;
 if(s.phase==='go'){
  const old=S.beat[t.type];
  if(el>=15&&el<=old){S.beat[t.type]=Math.max(60,old-10);s.msg=`Started in ${mmss(el)}. Next time to beat: ${mmss(S.beat[t.type])}.`}
  else s.msg='Started. That is what counts.';
  s.phase='work';
 }
 s.step++;
 if(s.step>=T.steps.length){
  if(inSchool())award(t);else{s.phase='proof';s.step=T.steps.length-1}
 } else {s.dur=T.steps[s.step][2]*60;s.t0=Date.now();if(s.phase==='work'&&s.step>1)s.msg=''}
 save();render();
}

function award(t,noMedal){
 const s=V.sess;t.done=true;t.doneAt=Date.now();
 if(!noMedal){S.medals++;S.doneLog.push(Date.now());s.medal=true}else s.medal=false;
 s.phase='done';chime();save();
}
function shrink(file,cb){
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};im.onerror=()=>cb(null);im.src=r.result};
 r.onerror=()=>cb(null);r.readAsDataURL(file);
}

  SAY='Exam words. Tap one to see what it means.';
  if(V.exam!=null){const e=EXAMWORDS[V.exam];SAY=`${e[0]}. ${e[2]} Example question: ${e[3]} Example answer: ${e[4]}`;
   return back+`<div class="card"><div class="row"><div class="tile">${ic(e[1],'big')}</div><h2 style="font-size:1.5em;flex:1">${e[0]}</h2><button class="iconbtn" style="background:var(--sage-l)" data-act="sayExam" aria-label="Read out loud">${ic('speaker')}</button></div>
   <p style="margin:0;font-size:1.1em">${esc(e[2])}</p></div>
   <div class="card"><span class="label">Question</span><p style="margin:0">${esc(e[3])}</p><span class="label">Answer could start</span><p style="margin:0">${esc(e[4])}</p></div>
   <button class="btn soft full" data-act="examBack">${ic('back')} All exam words</button>`}
  return back+`<div class="grid2">${EXAMWORDS.map((e,i)=>`<button class="pick" data-act="exam" data-v="${i}"><div class="tile">${ic(e[1],'big')}</div><b>${e[0]}</b></button>`).join('')}</div>`;
 }
 if(k==='templates'){
  SAY='Templates. Mind map and column notes.';
  const b=S.mm.b;
  const cell=i=>`<textarea data-mm="${i}" aria-label="Branch ${i+1}" placeholder="Key word">${esc(b[i])}</textarea>`;
  return back+`<div class="card"><div class="row">${ic('mindmap','big')}<h2>Mind map</h2></div><div class="small muted">Topic in the middle. Key words around it.</div>
   <div class="mm">${cell(0)}${cell(1)}${cell(2)}${cell(3)}<textarea class="c" data-mm="c" aria-label="Topic" placeholder="Topic">${esc(S.mm.c)}</textarea>${cell(4)}<span></span>${cell(5)}<span></span></div></div>
   <div class="card"><div class="row">${ic('columns','big')}<h2>Column notes</h2></div>
   <div class="cn"><span class="label">Key word</span><span class="label">Notes</span>${S.cn.rows.map((r,i)=>`<input type="text" data-cn="${i}-0" aria-label="Key word ${i+1}" value="${esc(r[0])}"><input type="text" data-cn="${i}-1" aria-label="Note ${i+1}" value="${esc(r[1])}">`).join('')}</div>
   <span class="label">Summary: one line</span><textarea data-cn="sum" aria-label="Summary">${esc(S.cn.sum)}</textarea></div>
   <div class="row"><button class="btn soft" data-act="print">Print</button><button class="btn ghost" data-act="clearTpl">Clear both</button></div>`;
 }
 if(k==='goals'){
  const wk=S.doneLog.filter(t=>Date.now()-t<7*864e5).length;
  const tgt=Math.max(2,wk+1);
  let g='';
  if(S.goal&&S.goal.accepted){const p=Math.min(100,Math.round(wk/S.goal.target*100));
   g=`<div class="card"><span class="label">Your goal this week</span><h2>Finish ${S.goal.target} tasks</h2><div class="bar"><i style="width:${p}%"></i></div><div class="small muted">${wk} of ${S.goal.target}${wk>=S.goal.target?' · Goal hit. Want a new one?':''}</div>${wk>=S.goal.target?`<button class="btn primary" data-act="newGoal">${ic('target')} Next goal</button>`:''}</div>`;
   SAY=`Your goal: finish ${S.goal.target} tasks this week. You have done ${wk}.`;
  } else {
   g=`<div class="card"><span class="label">This week</span><h2>You finished ${wk} task${wk===1?'':'s'}. Go for ${tgt}?</h2><div class="grid2"><button class="btn primary" data-act="goalYes" data-v="${tgt}">I'm in</button><button class="btn soft" data-act="go" data-v="drawers">Not now</button></div></div>`;
   SAY=`You finished ${wk} tasks this week. Go for ${tgt}?`;
  }
  const q=Object.keys(TYPES).filter(k=>S.beat[k]<S.beatStart[k]);
  return back+g+`<div class="card"><span class="label">Getting quicker to start</span>${q.length?q.map(k=>`<div class="row">${ic(TYPES[k].icon)}<span style="flex:1">${TYPES[k].name}</span><span class="muted">${mmss(S.beatStart[k])}</span>${ic('arrow')}<b style="color:var(--sage)">${mmss(S.beat[k])}</b></div>`).join(''):'<p class="small muted" style="margin:0">Finish a step one to see your times drop.</p>'}</div>`;
 }
 if(k==='bag'){
  SAY='Bag for tomorrow. Tap what is packed.';
  if(!S.set.bag)return back+`<div class="card"><h2>Bag check for tomorrow</h2><p class="small" style="margin:0">A quick checklist the night before. Only if it's useful to you.</p><button class="btn primary" data-act="bagOn">Use it</button></div>`;
  return back+`<div class="grid3">${BAG.map((b,i)=>`<button class="idea ${S.bag[i]?'on':''}" data-act="bagItem" data-v="${i}">${ic(S.bag[i]?'check':b[0],'big')}<span>${b[1]}</span></button>`).join('')}</div>
   <div class="row"><button class="btn soft" data-act="bagReset">${ic('redo')} New day</button><button class="btn ghost" data-act="bagOff">Turn off</button></div>`;
 }
 return back;
}

/* ---------- sheets ---------- */
function sheetAdd(){
 const a=V.add;let body='';
 const head=(t,backAct)=>`<div class="sheetHead">${backAct?`<button class="iconbtn" style="background:var(--sage-l)" data-act="${backAct}" aria-label="Back">${ic('back')}</button>`:''}<h2>${t}</h2><button class="iconbtn" style="background:var(--sage-l)" data-act="closeSheet" aria-label="Close">${ic('close')}</button></div>`;
 if(!a.subj)body=head('Which subject?')+`<div class="grid3">${Object.keys(SUBJ).map(s=>`<button class="pick" data-act="addSubj" data-v="${s}"><div class="tile">${ic(SUBJ[s],'big')}</div>${s}</button>`).join('')}</div>`;
 else if(!a.type)body=head('What kind?','addBack')+`<div class="grid2">${Object.keys(TYPES).map(t=>`<button class="pick" data-act="addType" data-v="${t}"><div class="tile">${ic(TYPES[t].icon,'big')}</div>${TYPES[t].name}</button>`).join('')}</div>`;
 else if(!a.when)body=head('When is it due?','addBack')+`<div class="stack"><button class="btn soft full" data-act="addWhen" data-v="tomorrow">${ic('calendar')} Tomorrow</button><button class="btn soft full" data-act="addWhen" data-v="week">${ic('calendar')} Later this week</button></div>`;
 else body=head('Anything to remember?','addBack')+`<div class="small muted">Page, questions, title. You can skip this.</div><input type="text" id="detail" placeholder="e.g. Page 42, Q1 to 5"><button class="btn primary full" data-act="addSave">${ic('check')} Save</button><button class="btn ghost" data-act="addSave" data-v="skip">Skip</button>`;
 return body;
}
function sheetSettings(){
 const s=S.set;
 const fonts=[['lexend','Lexend',"'Lexend'"],['atkinson','Atkinson',"'Atkinson Hyperlegible'"],['arial','Arial','Arial']];
 const tints=[['#FBF6EA','Cream'],['#EEF3F8','Pale blue'],['#EEF4EA','Pale green'],['#FBF6D9','Pale yellow'],['#FAEDE6','Peach']];
 return `<div class="sheetHead"><h2>Settings</h2><button class="iconbtn" style="background:var(--sage-l)" data-act="closeSheet" aria-label="Close">${ic('close')}</button></div>
 <span class="label">Letters</span><div class="opt">${fonts.map(f=>`<button class="${s.font===f[0]?'on':''}" style="font-family:${f[2]},sans-serif" data-act="font" data-v="${f[0]}">${f[1]}</button>`).join('')}</div>
 <span class="label">Size</span><div class="opt">${[[18,'A'],[20,'A+'],[22,'A++']].map(z=>`<button class="${s.size===z[0]?'on':''}" data-act="size" data-v="${z[0]}">${z[1]}</button>`).join('')}</div>
 <span class="label">Paper colour</span><div class="opt">${tints.map(t=>`<button class="swatch ${s.tint===t[0]?'on':''}" style="background:${t[0]}" data-act="tint" data-v="${t[0]}" aria-label="${t[1]}"></button>`).join('')}</div>
 <span class="label">Reading voice</span><div class="opt"><button class="${s.rate<.85?'on':''}" data-act="rate" data-v=".75">Slower</button><button class="${s.rate>=.85?'on':''}" data-act="rate" data-v=".9">Normal</button><button data-act="testVoice">${ic('speaker')} Test</button></div>
 <span class="label">Help</span><div class="opt"><button data-act="tour">Show the welcome</button><button data-act="resetSigns">Bring the signs back</button></div>
 <div class="card" style="background:var(--sage-l)"><span class="label">Teacher preview</span>
  <div class="opt"><button class="${s.showAll?'on':''}" data-act="showAll">${s.showAll?ic('check'):''} Open every drawer</button></div>
  <span class="label">Clock</span><div class="opt"><button class="${!s.demo?'on':''}" data-act="demo" data-v="">Real time</button><button class="${s.demo==='school'?'on':''}" data-act="demo" data-v="school">In class (Wed 10:30)</button><button class="${s.demo==='evening'?'on':''}" data-act="demo" data-v="evening">At home (Wed 19:30)</button></div>
  <div class="small">In class, no proof needed. At home, a photo of the work earns the medal.</div>
  <div class="small">Sample timetable for now. Real Synge St timetables come later.</div>
  <button class="btn ghost" data-act="reset">${V.confirmReset?'Tap again to wipe everything':'Start fresh (wipe all)'}</button></div>`;
}

/* ---------- render ---------- */
const NAV=[['today','Today','clock'],['homework','Homework','book'],['start','Start','play'],['drawers','Drawers','drawer']];
const SIGNS={
 today:['clock','Today','Where you are now, and what is next.','Just look. Tap "See full day" to see the whole day.'],
 homework:['book','Homework','Everything you have to do.','Tap "Add homework" to add one. Tap "Start" to begin.'],
 start:['play','Start','Do one task, one step at a time.','Do the step. Then tap the big button.'],
 drawers:['drawer','Drawers','Your medals and your extra tools.','Finish tasks to earn medals. Medals open drawers.'],
 words:['words','Word bank','Good words for your writing.','Tap words to hear them and build a sentence.'],
 exam:['talk','Exam words','What the exam question wants you to do.','Tap a word to see what it means.'],
 templates:['mindmap','Templates','Pages to help you study.','Type in the boxes. The topic goes in the middle.'],
 goals:['target','Goals','Something to aim for this week.','Tap "I\'m in" to take the goal.'],
 bag:['bag','Bag','Check you have everything for tomorrow.','Tap each thing when it is in your bag.']
};
let LASTKEY=null;
function signKey(){if(V.view==='drawers'&&V.drawer)return V.drawer;if(V.view==='start'&&V.sess&&V.sess.phase!=='go')return null;return V.view}
function signHTML(k){
 if(!k||!SIGNS[k])return '';
 const g=SIGNS[k],seen=(S.seen||{})[k]||0;
 if(seen>3&&V.forceSign!==k)return (k==='start'&&V.sess)?'':`<button class="help" data-act="showSign" data-v="${k}" aria-label="What is this page?">?</button>`;
 return `<div class="sign" id="sign"><div class="row"><div class="tile">${ic(g[0],'big')}</div><div style="flex:1"><div class="label">This is</div><h2 style="font-size:1.25em">${g[1]}</h2></div><button class="iconbtn" style="background:var(--sage-l)" data-act="saySign" data-v="${k}" aria-label="Read out loud">${ic('speaker')}</button></div>
  <p>${g[2]}</p><p><b>What to do:</b> ${g[3]}</p><button class="btn soft" data-act="gotSign" data-v="${k}">${ic('check')} Got it</button></div>`;
}
function sheetWelcome(){
 return `<div class="sheetHead"><h2>Welcome to A Hand.</h2><button class="iconbtn" style="background:var(--sage-l)" data-act="sayWelcome" aria-label="Read out loud">${ic('speaker')}</button></div>
 <p style="margin:0">Four buttons at the bottom. That's all you need.</p>
 ${NAV.map(n=>`<div class="row"><div class="tile">${ic(n[2],'big')}</div><div><b>${n[1]}</b><div class="small muted">${SIGNS[n[0]][2]}</div></div></div>`).join('')}
 <div class="row"><div class="tile">${ic('speaker','big')}</div><div><b>Speaker</b><div class="small muted">Reads the page out loud.</div></div></div>
 <div class="row"><div class="tile" style="font-weight:600;font-size:1.4em">?</div><div><b>Question mark</b><div class="small muted">Tells you what a page is for.</div></div></div>
 <button class="btn primary full" data-act="welcomeDone">${ic('play')} Let's go</button>`;
}
function render(){
 applySettings();
 document.getElementById('date').textContent=now().toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'short'});
 document.getElementById('medals').textContent=S.medals;
 SAY='';
 const v=V.view;
 S.seen=S.seen||{};const k=signKey();
 if(k&&k!==LASTKEY){S.seen[k]=(S.seen[k]||0)+1;save()}LASTKEY=k;
 const body=v==='today'?vToday():v==='homework'?vHomework():v==='start'?vStart():vDrawers();
 const sg=signHTML(k);
 if(sg&&!sg.startsWith('<button')&&SIGNS[k])SAY=`This is ${SIGNS[k][1]}. ${SIGNS[k][2]} What to do: ${SIGNS[k][3]} `+SAY;
 document.getElementById('view').innerHTML=sg+body;
 document.getElementById('nav').innerHTML=NAV.map(n=>`<button class="${v===n[0]?'on':''}" data-act="go" data-v="${n[0]}">${ic(n[2])}${n[1]}</button>`).join('');
 const L=document.getElementById('layer');
 L.innerHTML=V.sheet?`<div class="overlay" data-act="bg"><div class="sheet" role="dialog" aria-modal="true">${V.sheet==='add'?sheetAdd():V.sheet==='welcome'?sheetWelcome():sheetSettings()}</div></div>`:'';
 clearInterval(TICK);if(V.sess&&['go','work','break'].includes(V.sess.phase)&&v==='start'){tick();TICK=setInterval(tick,250)}
}
document.getElementById('medalIcon').innerHTML=ic('medal');
document.getElementById('spk').innerHTML=ic('speaker');
document.getElementById('gear').innerHTML=ic('gear');

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,v=b.dataset.v;
 if(a==='bg'){if(e.target===b){V.sheet=null;render()}return}
 switch(a){
  case 'go':V.view=v;V.sheet=null;V.forceSign=null;if(V.sess&&V.sess.phase==='finished')V.sess=null;if(v==='drawers')V.drawer=null;break;
  case 'say':speak(SAY||'');return;
  case 'settings':V.sheet='settings';V.confirmReset=false;break;
  case 'closeSheet':V.sheet=null;break;
  case 'gotSign':{S.seen[v]=99;V.forceSign=null;save();const el=document.getElementById('sign');if(el){el.classList.add('out');setTimeout(render,450);return}break}
  case 'showSign':V.forceSign=v;break;
  case 'saySign':{const g=SIGNS[v];speak(`This is ${g[1]}. ${g[2]} What to do: ${g[3]}`);return}
  case 'welcomeDone':S.welcomed=true;V.sheet=null;save();break;
  case 'sayWelcome':speak('Welcome to A Hand. Four buttons at the bottom. '+NAV.map(n=>n[1]+': '+SIGNS[n[0]][2]).join(' ')+' The speaker reads the page out loud. The question mark tells you what a page is for.');return;
  case 'tour':V.sheet='welcome';break;
  case 'resetSigns':S.seen={};LASTKEY=null;V.sheet=null;save();toast('Signs are back.');break;
  case 'toggleDay':V.showDay=!V.showDay;break;
  case 'tab':V.tab=v;break;
  case 'add':V.add={};V.sheet='add';break;
  case 'addSubj':V.add.subj=v;break;
  case 'addType':V.add.type=v;break;
  case 'addWhen':V.add.when=v;break;
  case 'addBack':if(V.add.when)delete V.add.when;else if(V.add.type)delete V.add.type;else delete V.add.subj;break;
  case 'addSave':{const d=v==='skip'?'':(document.getElementById('detail')||{}).value||'';
   S.hw.push({id:S.nextId++,subj:V.add.subj,type:V.add.type,when:V.add.when,detail:d.trim(),done:false});V.tab=V.add.when;V.sheet=null;V.view='homework';save();toast('Added. Sorted.');break}
  case 'clearDone':S.hw=S.hw.filter(h=>!h.done);save();break;
  case 'startTonight':startSession(plan().filter(h=>h.when==='tomorrow').map(h=>h.id).concat(plan().filter(h=>h.when==='tomorrow').length?[]:plan().slice(0,1).map(h=>h.id)));return;
  case 'startOne':startSession([Number(v)]);return;
  case 'sayStep':{const t=sessTask();speak(TYPES[t.type].steps[V.sess.step][1]);return}
  case 'stepDone':if(b.disabled)return;stepDone();return;
  case 'notYet':V.sess.phase='work';V.sess.t0=Date.now();V.sess.dur=Math.max(120,(TYPES[sessTask().type].steps[V.sess.step][2]||2)*60);break;
  case 'noProof':award(sessTask(),true);break;
  case 'toBreak':V.sess.phase='break';V.sess.dur=300;V.sess.t0=Date.now();V.sess.chimed=false;V.ideas=[];break;
  case 'idea':{const i=Number(v);V.ideas=V.ideas.includes(i)?V.ideas.filter(x=>x!==i):[...V.ideas,i];speak(IDEAS[i][1]);break}
  case 'breakDone':{const s=V.sess;s.idx++;const t=sessTask();s.phase='go';s.step=0;s.t0=Date.now();s.dur=S.beat[t.type];s.msg='';chime();break}
  case 'endSess':{const s=V.sess;if(s&&s.phase==='done'&&s.idx>=s.queue.length-1){s.phase='finished';break}V.sess=null;V.view='homework';break}
  case 'openDrawer':V.drawer=v;V.exam=null;V.forceSign=null;break;
  case 'lockedDrawer':{const d=DRAWERS.find(x=>x[0]===v);toast(d[3]<0?'Coming later.':`Opens at ${d[3]} medals. Keep going.`);return}
  case 'closeDrawer':V.drawer=null;break;
  case 'wbCat':V.wbCat=v;break;
  case 'word':speak(v);S.sentence.push(v);save();break;
  case 'sayLine':speak(S.sentence.join(' ')||'Tap some words first.');return;
  case 'undoWord':S.sentence.pop();save();break;
  case 'clearLine':S.sentence=[];save();break;
  case 'exam':V.exam=Number(v);break;
  case 'examBack':V.exam=null;break;
  case 'sayExam':speak(SAY);return;
  case 'print':try{window.print()}catch(err){}toast('Printing works once it is on the school site.');return;
  case 'clearTpl':S.mm={c:'',b:['','','','','','']};S.cn={rows:[['',''],['',''],['',''],['',''],['','']],sum:''};save();break;
  case 'goalYes':S.goal={target:Number(v),accepted:true};save();toast("You're in.");break;
  case 'newGoal':S.goal=null;save();break;
  case 'bagOn':S.set.bag=true;save();break;
  case 'bagOff':S.set.bag=false;save();break;
  case 'bagItem':S.bag[v]=!S.bag[v];save();break;
  case 'bagReset':S.bag={};save();break;
  case 'font':S.set.font=v;save();break;
  case 'size':S.set.size=Number(v);save();break;
  case 'tint':S.set.tint=v;save();break;
  case 'rate':S.set.rate=Number(v);save();break;
  case 'testVoice':speak('Hello. This is how I sound.');return;
  case 'showAll':S.set.showAll=!S.set.showAll;save();break;
  case 'demo':S.set.demo=v||false;save();break;
  case 'reset':if(!V.confirmReset){V.confirmReset=true;break}S=fresh();save();V={...V,view:'today',sheet:null,sess:null,drawer:null,confirmReset:false};toast('Fresh start.');break;
 }
 render();
});
document.addEventListener('change',e=>{
 if(e.target.id==='proofIn'&&e.target.files&&e.target.files[0]){shrink(e.target.files[0],d=>{if(!d){toast('That photo did not work. Try again.');return}const t=sessTask();t.proof=d;award(t);render()})}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.mm!==undefined){if(t.dataset.mm==='c')S.mm.c=t.value;else S.mm.b[Number(t.dataset.mm)]=t.value;save()}
 if(t.dataset.cn!==undefined){if(t.dataset.cn==='sum')S.cn.sum=t.value;else{const[r,c]=t.dataset.cn.split('-').map(Number);S.cn.rows[r][c]=t.value}save()}
});
try{speechSynthesis&&speechSynthesis.getVoices()}catch(e){}
if(!S.welcomed)V.sheet='welcome';
render();
</script>
</body>
</html>
