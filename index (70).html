<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Hand. — prototype</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#D62622">
<meta name="apple-mobile-web-app-title" content="A Hand.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --oak:#D8C3A0; --oak-d:#C2A67C;
  --leather:#A9BBA5; --leather-d:#98AC94;
  --brass:#B8955A;
  --paper:#FBF6EA; --ink:#33302B; --ink2:#5F5A52; --line:#E2D9C6;
  --sage:#4F6B55; --sage-l:#E6EDE2;
  --fs:18px; --font:'Lexend', Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--oak);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.6;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 30%, var(--leather) 0%, var(--leather-d) 100%);
  border-left:10px solid var(--oak);border-right:10px solid var(--oak);
  box-shadow:inset 0 0 0 3px var(--leather-d), inset 0 0 0 4px var(--brass), inset 0 0 50px rgba(40,50,35,.18)}
header{display:flex;align-items:center;gap:10px;padding:18px 18px 6px}
.brand{flex:1;display:flex;flex-direction:column;line-height:1.2}
.brand b{font-weight:600;font-size:1.15em}
.brand span{font-size:.8em}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:22px;padding:0 14px;height:44px;font-weight:600;border:none}
.iconbtn{width:48px;height:48px;border-radius:24px;border:none;background:var(--paper);display:flex;align-items:center;justify-content:center;flex:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.big{width:44px;height:44px}
svg.i.huge{width:72px;height:72px;stroke-width:1.4}
main{flex:1;padding:8px 18px 120px;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5em;font-weight:600;margin:4px 0 0;line-height:1.3}
h2{font-size:1em;font-weight:600;margin:0}
.card{background:var(--paper);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:14px}
.muted{color:var(--ink2)}
.small{font-size:.85em}
.label{font-size:.8em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.now{border:3px solid var(--sage)}
.tile{width:56px;height:56px;border-radius:14px;background:var(--sage-l);color:var(--sage);display:flex;align-items:center;justify-content:center;flex:none}
.btn{min-height:56px;border:none;border-radius:16px;padding:0 22px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.primary{background:var(--sage);color:var(--paper)}
.btn.soft{background:var(--sage-l);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.btn.full{width:100%}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pick{background:var(--paper);border:none;border-radius:16px;min-height:96px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:.9em}
.pick .tile{width:48px;height:48px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--paper);padding:6px;border-radius:16px}
.seg button{min-height:48px;border:none;border-radius:12px;background:transparent;font-weight:500}
.seg button.on{background:var(--sage);color:var(--paper)}
.badge{align-self:flex-start;background:var(--brass);color:#2B2418;font-size:.75em;font-weight:600;padding:2px 10px;border-radius:10px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:space-around;background:var(--oak);padding:8px 10px 14px;border-top:3px solid var(--oak-d)}
nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75em;min-width:72px;min-height:56px;padding:4px;border-radius:12px;color:var(--ink)}
nav button.on{background:var(--paper);font-weight:600}
.ring{position:relative;width:230px;height:230px;align-self:center}
.ring svg{width:230px;height:230px;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-size:3em;font-weight:600;line-height:1}
.step{background:var(--paper);border-radius:20px;padding:20px;display:flex;align-items:center;gap:16px}
.step .tile{width:72px;height:72px;border-radius:18px}
.step p{margin:0;font-size:1.2em;font-weight:500;line-height:1.4}
.drawer{background:linear-gradient(#E9D9BC,#DCC59F);border:none;border-radius:12px;min-height:118px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);color:var(--ink);text-align:center}
.drawer .handle{width:46px;height:8px;border-radius:4px;background:var(--brass)}
.drawer.locked{opacity:.6}
.drawer small{font-size:.75em}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{background:var(--paper);border:2px solid var(--line);border-radius:14px;min-height:48px;padding:6px 14px;font-size:1em}
.word.on{border-color:var(--sage);background:var(--sage-l)}
.sentence{background:var(--paper);border-radius:16px;padding:16px;min-height:72px;font-size:1.15em;border:2px dashed var(--sage)}
.overlay{position:fixed;inset:0;background:rgba(40,40,30,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--paper);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 28px;display:flex;flex-direction:column;gap:16px}
.sheet .pick{background:var(--sage-l)}
.sheetHead{display:flex;align-items:center;gap:10px}
.sheetHead h2{flex:1;font-size:1.2em}
input[type=text],textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;min-height:52px}
textarea{min-height:90px;resize:vertical}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.opt button{min-height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;padding:0 16px}
.opt button.on{border-color:var(--sage);background:var(--sage-l);font-weight:600}
.swatch{width:52px;height:52px;border-radius:26px;border:2px solid var(--line)}
.swatch.on{border:4px solid var(--sage)}
.mm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mm textarea{min-height:84px;font-size:.85em;padding:8px}
.mm .c{border-color:var(--sage);background:var(--sage-l);font-weight:600}
.cn{display:grid;grid-template-columns:2fr 3fr;gap:8px}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:14px;z-index:20;max-width:90%;text-align:center}
.done{text-decoration:line-through;color:var(--ink2)}
.idea{background:var(--paper);border:none;border-radius:16px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:.85em;padding:8px}
.idea.on{outline:3px solid var(--sage)}
.sign{background:var(--paper);border:3px solid var(--brass);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:opacity .5s, transform .5s}
.sign.out{opacity:0;transform:translateY(-8px)}
.sign p{margin:0}
.help{position:absolute;top:6px;right:18px;width:48px;height:48px;border-radius:24px;border:2px solid var(--brass);background:var(--paper);font-weight:600;font-size:1.2em}
main{position:relative}
.qrbox{background:#fff;padding:14px;border-radius:16px;align-self:center;display:flex;justify-content:center}
.qrbox img,.qrbox canvas{width:240px;height:240px}
.opt3{display:flex;flex-direction:column;gap:10px}
.ans{min-height:64px;border-radius:16px;border:3px solid var(--line);background:var(--paper);font-size:1.15em;font-weight:500;padding:8px 16px;text-align:left}
.ans.right{border-color:var(--sage);background:var(--sage-l)}
.ans.show{border-color:var(--brass);background:#F4EAD6}
.prompt{background:var(--paper);border-radius:20px;padding:26px 18px;text-align:center;font-size:1.6em;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px}
.ttpic{background:#fff;border-radius:14px;overflow:auto;max-height:240px;-webkit-overflow-scrolling:touch}
.ttpic img{display:block;width:100%}
.ttpic.zoom img{width:220%}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.btn[disabled]{opacity:.5}
a{color:var(--sage)}
</style>

/* sound + voice */
let AC=null;
function chime(){
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  [[523.25,0],[659.25,.35],[783.99,.7]].forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
   g.gain.setValueAtTime(0,AC.currentTime+t);g.gain.linearRampToValueAtTime(.12,AC.currentTime+t+.05);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+1.2);
   o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+1.3)});
 }catch(e){}
 try{navigator.vibrate&&navigator.vibrate([150,80,150])}catch(e){}
}
function speak(text){
 try{if(!('speechSynthesis' in window))return toast('Read-aloud is not available here');
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
  const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/en-IE/i.test(v.lang))||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
  u.lang=u.voice?u.voice.lang:'en-GB';u.rate=S.set.rate;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- practice (LOOPS ENGINE SEAM) ----------
   playDeck / answer below are a simple spaced-repetition game.
   Swap them for the Loops engine: it receives a deck {name, cards:[{f,b,box,due}]}
   and must update box/due on each card, then call practiceDone(). */
const GAPS=[0,1,2,4,8,16]; /* days per box */
const DAY=864e5;
function dueCards(d){return d.cards.filter(c=>(c.due||0)<=Date.now())}
function decksDue(){return (S.decks||[]).filter(d=>dueCards(d).length)}
function playDeck(id){
 const d=S.decks.find(x=>x.id===id);if(!d)return;
 let q=dueCards(d);if(!q.length)q=d.cards.slice();
 q=q.sort(()=>Math.random()-.5).slice(0,10);
 V.view='drawers';V.drawer='practice';
 V.game={deck:id,queue:q.map(c=>d.cards.indexOf(c)),pos:0,total:q.length,picked:null,opts:null,missed:{}};
 makeOpts();chime();
}
function makeOpts(){
 const g=V.game,d=S.decks.find(x=>x.id===g.deck),c=d.cards[g.queue[g.pos]];
 const others=d.cards.filter(x=>x!==c&&x.b!==c.b).sort(()=>Math.random()-.5).slice(0,2).map(x=>x.b);
 g.opts=[c.b,...others].sort(()=>Math.random()-.5);g.picked=null;
}
function answer(i){
 const g=V.game,d=S.decks.find(x=>x.id===g.deck),ci=g.queue[g.pos],c=d.cards[ci];
 if(g.picked!=null)return;g.picked=i;
 if(g.opts[i]===c.b){blip();if(!g.missed[ci]){c.box=Math.min(5,(c.box||0)+1)}c.due=Date.now()+GAPS[c.box||0]*DAY-36e5}
 else{c.box=0;c.due=Date.now();if(!g.missed[ci]){g.missed[ci]=1;g.queue.push(ci)}}
 save();render();
}
function nextCard(){const g=V.game;g.pos++;if(g.pos>=g.queue.length)return practiceDone();makeOpts();render()}
function practiceDone(){S.medals++;S.doneLog.push(Date.now());V.game.done=true;chime();save();render()}
/* deck share codes */
function enc(o){const b=new TextEncoder().encode(JSON.stringify(o));let t='';b.forEach(x=>t+=String.fromCharCode(x));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(t){try{t=t.replace(/-/g,'+').replace(/_/g,'/');const r=atob(t),b=new Uint8Array(r.length);for(let i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return JSON.parse(new TextDecoder().decode(b))}catch(e){return null}}
function appLink(){
 if(S.set.appLink)return S.set.appLink;
 try{if(location.protocol.startsWith('http'))return location.origin+location.pathname}catch(e){}
 return 'https://YOUR-NAME.github.io/a-hand/';
}

const ALIAS={Maths:['maths','math','sums'],English:['english'],Irish:['irish','gaeilge'],Spanish:['spanish'],French:['french'],German:['german'],
 Science:['science'],History:['history'],Geography:['geography','geog'],Business:['business'],Art:['art'],PE:['p.e','pe ','p e'],Music:['music'],
 Religion:['religion','r.e'],SPHE:['sphe'],CSPE:['cspe'],Woodwork:['woodwork','wood'],'Home Ec':['home ec','home economics']};
const TALIAS=[['questions',['question','exercise','sums','problems','worksheet']],['learn',['learn','spelling','vocab','words','off by heart']],
 ['read',['read']],['write',['write','essay','paragraph','story','letter','writing']],['study',['study','revise','revision','test','exam']],['project',['project']]];
function parseSpoken(t){
 const x=' '+t.toLowerCase()+' ',o={detail:t.trim()};
 for(const k in ALIAS)if(ALIAS[k].some(a=>x.includes(a))){o.subj=k;break}
 for(const [k,al] of TALIAS)if(al.some(a=>x.includes(a))){o.type=k;break}
 if(/tomorrow/.test(x))o.when='tomorrow';else if(/week|monday|tuesday|wednesday|thursday|friday|next/.test(x))o.when='week';
 return o;
}

  REC.onend=()=>{if(V.listening){V.listening=false;render()}};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,v=b.dataset.v;
 if(a==='bg'){if(e.target===b){V.sheet=null;render()}return}
 switch(a){
  case 'go':V.view=v;V.sheet=null;V.forceSign=null;if(V.sess&&V.sess.phase==='finished')V.sess=null;if(v==='drawers')V.drawer=null;break;
  case 'say':speak(SAY||'');return;
  case 'settings':V.sheet='settings';V.confirmReset=false;break;
  case 'closeSheet':V.sheet=null;V.deckQR=null;V.ttQR=null;break;
  case 'gotSign':{S.seen[v]=99;V.forceSign=null;save();const el=document.getElementById('sign');if(el){el.classList.add('out');setTimeout(render,450);return}break}
  case 'showSign':V.forceSign=v;break;
  case 'saySign':{const g=SIGNS[v];speak(`This is ${g[1]}. ${g[2]} What to do: ${g[3]}`);return}
  case 'welcomeDone':S.welcomed=true;V.sheet=null;save();if(!S.setupDone)openSetup('me','start');break;
  case 'openSetup':openSetup('me',v);break;
  case 'openTeacherTT':openSetup('teacher','week');break;
  case 'setupBlank':V.setup.draft=blankTT();V.setup.step='week';break;
  case 'ttZoom':V.ttZoom=!V.ttZoom;break;
  case 'tday':V.setup.day=Number(v);break;
  case 'copyPrev':{const st=V.setup,prev=st.draft[st.day-1];st.draft[st.day]=st.draft[st.day].map((x,i)=>prev[i]?{...prev[i]}:x);toast('Copied. Change what is different.');break}
  case 'slot':V.slotI=Number(v);V.sheet='slot';break;
  case 'slSubj':{const sl=V.setup.draft[V.setup.day][V.slotI];sl.subj=v;if(v){const m=Object.values(V.setup.draft).flat().find(x=>x!==sl&&x.subj===v&&(x.room||x.teacher));if(m&&!sl.room&&!sl.teacher){sl.room=m.room;sl.teacher=m.teacher}}break}
  case 'slKey':{const sl=V.setup.draft[V.setup.day][V.slotI];if(v==='back')sl.room=sl.room.slice(0,-1);else sl.room=(sl.room+v).slice(0,14);break}
  case 'slTeach':{const sl=V.setup.draft[V.setup.day][V.slotI];sl.teacher=sl.teacher===v?'':v;break}
  case 'slAddTeach':{const el=document.getElementById('tname'),n=(el&&el.value||'').trim();if(!n)return;S.teachers=S.teachers||[];if(!S.teachers.includes(n))S.teachers.push(n);V.setup.draft[V.setup.day][V.slotI].teacher=n;save();break}
  case 'slAll':{const sl=V.setup.draft[V.setup.day][V.slotI];let n=0;Object.values(V.setup.draft).flat().forEach(x=>{if(x.subj===sl.subj&&x!==sl){x.room=sl.room;x.teacher=sl.teacher;n++}});toast(`Done for ${n} more ${sl.subj} class${n===1?'':'es'}.`);break}
  case 'setupNext':S.tt=normTT(V.setup.draft);save();V.setup.step='you';break;
  case 'setupFinish':S.set.name=(V.setup.name||'').trim();S.tt=normTT(V.setup.draft);S.setupDone=true;save();V.view='today';V.setup=null;toast('All set.');break;
  case 'ttMakeQR':{const g=((document.getElementById('ttGroup')||{}).value||'').trim()||'Class';V.setup.group=g;
   const d={};for(let k=1;k<=5;k++)d[k]=V.setup.draft[k].map(x=>[x.subj,x.room,x.teacher]);
   V.ttQR={group:g,link:appLink()+'?tt='+enc({g,d})};V.sheet='ttQR';break}
  case 'ttImportYes':{const t=V.ttImport,o={};for(let k=1;k<=5;k++)o[k]=(t.d[k]||[]).map(x=>({subj:x[0]||'',room:x[1]||'',teacher:x[2]||''}));
   S.tt=normTT(o);S.teachers=S.teachers||[];Object.values(S.tt).flat().forEach(x=>{if(x.teacher&&!S.teachers.includes(x.teacher))S.teachers.push(x.teacher)});
   S.welcomed=true;save();openSetup('me','week');toast('Now change anything that is different for you.');break}
  case 'sayWelcome':speak('Welcome to A Hand. Four buttons at the bottom. '+NAV.map(n=>n[1]+': '+SIGNS[n[0]][2]).join(' ')+' The speaker reads the page out loud. The question mark tells you what a page is for.');return;
  case 'tour':V.sheet='welcome';break;
  case 'resetSigns':S.seen={};LASTKEY=null;V.sheet=null;save();toast('Signs are back.');break;
  case 'toggleDay':V.showDay=!V.showDay;break;
  case 'tab':V.tab=v;break;
  case 'add':V.add={};V.sheet='add';break;
  case 'addSubj':V.add.subj=v;break;
  case 'addType':V.add.type=v;break;
  case 'addWhen':V.add.when=v;break;
  case 'voiceAdd':listen(t=>{Object.assign(V.add,parseSpoken(t));render()});return;
  case 'voiceDetail':listen(t=>{V.add.detail=t;render()});return;
  case 'addFix':delete V.add[v];if(v==='subj'){}break;
  case 'play':playDeck(Number(v));break;
  case 'ans':answer(Number(v));return;
  case 'nextCard':nextCard();return;
  case 'quitGame':V.game=null;break;
  case 'sayCard':{const g=V.game,d=S.decks.find(x=>x.id===g.deck);speak(d.cards[g.queue[g.pos]].f);return}
  case 'delDeck':{const id=Number(v);if(V.confirmDel!==id){V.confirmDel=id;break}S.decks=S.decks.filter(d=>d.id!==id);V.confirmDel=null;save();break}
  case 'newDeck':V.deckFor=v;V.deckDraft={name:'',text:''};V.deckQR=null;V.sheet='deck';break;
  case 'dkVoice':{const nm=document.getElementById('dkName'),tx=document.getElementById('dkText');V.deckDraft={name:nm?nm.value:'',text:tx?tx.value:''};
   listen(t=>{const line=t.replace(/\s+(equals|means|is)\s+/i,' = ');V.deckDraft.text=(V.deckDraft.text?V.deckDraft.text.replace(/\s*$/,'')+'\n':'')+line;render()});return}
  case 'dkSave':{const nm=(document.getElementById('dkName').value||'').trim()||'My words',tx=document.getElementById('dkText').value,cards=parseLines(tx);
   V.deckDraft={name:nm,text:tx};
   if(cards.length<2){toast('Add at least 2 lines like: word = meaning');break}
   if(V.deckFor==='teacher'){const code=enc({n:nm,c:cards.slice(0,40).map(c=>[c.f,c.b])});const link=appLink()+'?deck='+code;
    if(cards.length>40)toast('Only the first 40 fit in one code.');V.deckQR={name:nm,n:Math.min(40,cards.length),link};break}
   S.decks=S.decks||[];S.decks.push({id:S.nextId++,name:nm,from:'me',cards:cards.map(c=>({...c,box:0,due:0}))});save();V.sheet=null;V.view='drawers';V.drawer='practice';toast('Deck saved.');break}
  case 'copyLink':{const t=V.qrText||appLink();try{navigator.clipboard.writeText(t).then(()=>toast('Link copied.'),()=>toast(t))}catch(err){toast(t)}return}
  case 'saveLink':{const el=document.getElementById('appLinkIn');S.set.appLink=(el.value||'').trim();save();toast('Saved.');break}
  case 'importYes':{const d=V.importDeck;S.decks=S.decks||[];S.decks.push({id:S.nextId++,name:d.n,from:'teacher',cards:d.c.map(c=>({f:c[0],b:c[1],box:0,due:0}))});save();V.sheet=null;V.view='drawers';V.drawer='practice';toast('Added. Tap Play.');break}
  case 'importNo':V.sheet=null;break;
  case 'addBack':if(V.add.when)delete V.add.when;else if(V.add.type)delete V.add.type;else delete V.add.subj;break;
  case 'addSave':{const d=(document.getElementById('detail')||{}).value||'';
   S.hw.push({id:S.nextId++,subj:V.add.subj,type:V.add.type,when:V.add.when,detail:d.trim(),done:false});V.tab=V.add.when;V.sheet=null;V.view='homework';save();toast('Added. Sorted.');break}
  case 'clearDone':S.hw=S.hw.filter(h=>!h.done);save();break;
  case 'startTonight':startSession(plan().filter(h=>h.when==='tomorrow').map(h=>h.id).concat(plan().filter(h=>h.when==='tomorrow').length?[]:plan().slice(0,1).map(h=>h.id)));return;
  case 'startOne':startSession([Number(v)]);return;
  case 'sayStep':{const t=sessTask();speak(TYPES[t.type].steps[0][1]);return}
  case 'started':started();return;
  case 'tickStep':tickStep(Number(v));return;
  case 'notYet':{const s=V.sess;s.phase='work';const n=TYPES[sessTask().type].steps.length-2;s.ticks[n]=false;break}
  case 'noProof':award(sessTask(),true);break;
  case 'toBreak':V.sess.phase='break';V.sess.dur=300;V.sess.t0=Date.now();V.sess.chimed=false;V.ideas=[];break;
  case 'idea':{const i=Number(v);V.ideas=V.ideas.includes(i)?V.ideas.filter(x=>x!==i):[...V.ideas,i];speak(IDEAS[i][1]);break}
  case 'breakDone':{const s=V.sess;s.idx++;s.phase='go';s.ticks=[];s.t0=Date.now();s.dur=120;chime();break}
  case 'endSess':{const s=V.sess;if(s&&s.phase==='done'&&s.idx>=s.queue.length-1){s.phase='finished';break}V.sess=null;V.view='homework';break}
  case 'openDrawer':V.drawer=v;V.exam=null;V.forceSign=null;V.game=null;break;
  case 'lockedDrawer':{const d=DRAWERS.find(x=>x[0]===v);toast(d[3]<0?'Coming later.':`Opens at ${d[3]} medals. Keep going.`);return}
  case 'closeDrawer':V.drawer=null;break;
  case 'wbCat':V.wbCat=v;break;
  case 'word':speak(v);S.sentence.push(v);save();break;
  case 'sayLine':speak(S.sentence.join(' ')||'Tap some words first.');return;
  case 'undoWord':S.sentence.pop();save();break;
  case 'clearLine':S.sentence=[];save();break;
  case 'exam':V.exam=Number(v);break;
  case 'examBack':V.exam=null;break;
  case 'sayExam':speak(SAY);return;
  case 'print':try{window.print()}catch(err){}toast('Printing works once it is on the school site.');return;
  case 'clearTpl':S.mm={c:'',b:['','','','','','']};S.cn={rows:[['',''],['',''],['',''],['',''],['','']],sum:''};save();break;
  case 'goalYes':S.goal={target:Number(v),accepted:true};save();toast("You're in.");break;
  case 'newGoal':S.goal=null;save();break;
  case 'bagOn':S.set.bag=true;save();break;
  case 'bagOff':S.set.bag=false;save();break;
  case 'bagItem':S.bag[v]=!S.bag[v];save();break;
  case 'bagReset':S.bag={};save();break;
  case 'font':S.set.font=v;save();break;
  case 'size':S.set.size=Number(v);save();break;
  case 'tint':S.set.tint=v;save();break;
  case 'rate':S.set.rate=Number(v);save();break;
  case 'testVoice':speak('Hello. This is how I sound.');return;
  case 'showAll':S.set.showAll=!S.set.showAll;save();break;
  case 'demo':S.set.demo=v||false;save();break;
  case 'reset':if(!V.confirmReset){V.confirmReset=true;break}S=fresh();save();V={...V,view:'today',sheet:null,sess:null,drawer:null,confirmReset:false};toast('Fresh start.');break;
 }
 render();
});
function shrinkTo(file,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.onerror=()=>cb(null);im.src=r.result};r.onerror=()=>cb(null);r.readAsDataURL(file)}
document.addEventListener('change',e=>{
 if(e.target.id==='ttPhotoIn'&&e.target.files&&e.target.files[0]){shrinkTo(e.target.files[0],1400,d=>{if(!d){toast('That photo did not work. Try again.');return}S.ttPhoto=d;save();if(V.setup&&V.setup.step==='start'){V.setup.draft=blankTT();V.setup.step='week'}render();toast('Photo added. Copy each box into your week.')});return}
 if(e.target.id==='proofIn'&&e.target.files&&e.target.files[0]){shrink(e.target.files[0],d=>{if(!d){toast('That photo did not work. Try again.');return}const t=sessTask();t.proof=d;award(t);render()})}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.field==='name'&&V.setup){V.setup.name=t.value}
 if(t.dataset.mm!==undefined){if(t.dataset.mm==='c')S.mm.c=t.value;else S.mm.b[Number(t.dataset.mm)]=t.value;save()}
 if(t.dataset.cn!==undefined){if(t.dataset.cn==='sum')S.cn.sum=t.value;else{const[r,c]=t.dataset.cn.split('-').map(Number);S.cn.rows[r][c]=t.value}save()}
});
try{speechSynthesis&&speechSynthesis.getVoices()}catch(e){}
S.decks=S.decks||[];
S.tt=S.tt?normTT(S.tt):sampleTT();
if(!S.welcomed)V.sheet='welcome';
try{const tq=new URLSearchParams(location.search).get('tt');if(tq){const t=dec(tq);if(t&&t.d){V.ttImport=t;V.sheet='ttImport';try{history.replaceState(null,'',location.pathname)}catch(e){}}}}catch(e){}
try{const q=new URLSearchParams(location.search).get('deck')||(location.hash.startsWith('#deck=')?location.hash.slice(6):null);
 if(q){const d=dec(q);if(d&&d.n&&Array.isArray(d.c)){V.importDeck=d;V.sheet='import';try{history.replaceState(null,'',location.pathname)}catch(e){}}}}catch(e){}
render();
</script>
